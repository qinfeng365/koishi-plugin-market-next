name: Strix Security Scan

on:
  pull_request:
    types:
      - opened
      - ready_for_review
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: strix-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Quick security scan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.action == 'ready_for_review' ||
          (github.event.action == 'opened' && github.event.pull_request.draft == false)
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          contains(github.event.comment.body, '@github-actions strix-review') ||
          contains(github.event.comment.body, '@github-actions 复查')
        ) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve pull request
        id: pr
        if: github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.eventName === 'issue_comment'
              ? context.payload.issue.number
              : context.payload.pull_request.number
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            })
            const sameRepo = pullRequest.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`

            core.setOutput('number', String(pullRequest.number))
            core.setOutput('head_sha', pullRequest.head.sha)
            core.setOutput('base_ref', pullRequest.base.ref)
            core.setOutput('same_repo', String(sameRepo))

      - name: Acknowledge review command
        if: github.event_name == 'issue_comment' && steps.pr.outputs.same_repo == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              ...context.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            })

      - name: Checkout
        if: github.event_name == 'workflow_dispatch' || steps.pr.outputs.same_repo == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || steps.pr.outputs.head_sha }}

      - name: Fetch pull request base
        if: github.event_name != 'workflow_dispatch' && steps.pr.outputs.same_repo == 'true'
        shell: bash
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Install Strix
        if: github.event_name == 'workflow_dispatch' || steps.pr.outputs.same_repo == 'true'
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Strix
        id: strix
        if: github.event_name == 'workflow_dispatch' || steps.pr.outputs.same_repo == 'true'
        shell: bash
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          STRIX_LLM: openai/gemini-3.7-flash
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          LLM_API_BASE: https://newapi.mikumiku.love/v1
          STRIX_REASONING_EFFORT: high
          STRIX_TELEMETRY: '0'
        run: |
          if [[ -z "${LLM_API_KEY}" ]]; then
            echo "::error::Repository secret STRIX_LLM_API_KEY is not configured."
            exit 1
          fi

          scope_args=(--scope-mode full)
          if [[ -n "${BASE_REF}" ]]; then
            scope_args=(--scope-mode diff --diff-base "origin/${BASE_REF}")
          fi

          strix -n \
            --target ./ \
            --scan-mode quick \
            "${scope_args[@]}" \
            --instruction-file .github/strix-instructions.md

      - name: Upload Strix results
        if: always() && (github.event_name == 'workflow_dispatch' || steps.pr.outputs.same_repo == 'true')
        uses: actions/upload-artifact@v5
        with:
          name: strix-results-${{ github.run_id }}
          path: strix_runs
          if-no-files-found: warn
          retention-days: 14

      - name: Update pull request comment
        if: always() && github.event_name != 'workflow_dispatch' && steps.pr.outputs.same_repo == 'true'
        uses: actions/github-script@v8
        env:
          STRIX_STEP_OUTCOME: ${{ steps.strix.outcome }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const marker = '<!-- strix-review-comment -->'
            const runsRoot = path.join(process.env.GITHUB_WORKSPACE, 'strix_runs')
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            let report = ''
            let scanStatus = process.env.STRIX_STEP_OUTCOME || 'unknown'

            if (fs.existsSync(runsRoot)) {
              const runDirs = fs.readdirSync(runsRoot, { withFileTypes: true })
                .filter((entry) => entry.isDirectory())
                .map((entry) => {
                  const fullPath = path.join(runsRoot, entry.name)
                  return { fullPath, mtimeMs: fs.statSync(fullPath).mtimeMs }
                })
                .sort((left, right) => right.mtimeMs - left.mtimeMs)

              const latestRun = runDirs[0]?.fullPath
              if (latestRun) {
                const reportPath = path.join(latestRun, 'penetration_test_report.md')
                const runJsonPath = path.join(latestRun, 'run.json')

                if (fs.existsSync(reportPath)) {
                  report = fs.readFileSync(reportPath, 'utf8').trim()
                }

                if (fs.existsSync(runJsonPath)) {
                  try {
                    scanStatus = JSON.parse(fs.readFileSync(runJsonPath, 'utf8')).status || scanStatus
                  } catch (error) {
                    core.warning(`Could not parse run.json: ${error.message}`)
                  }
                }
              }
            }

            if (!report) {
              report = 'Strix 未生成审查报告。请打开下方运行记录查看安装、模型连接或扫描错误。'
            }

            const maxReportChars = 55000
            if (report.length > maxReportChars) {
              report = `${report.slice(0, maxReportChars)}\n\n> 评论内容已截断，完整报告请从 Action Artifact 下载。`
            }

            const body = [
              marker,
              '## Strix 审查结果',
              '',
              `**扫描状态：** ${scanStatus}`,
              '',
              report,
              '',
              '---',
              `[查看完整运行与下载报告](${runUrl})`,
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }
