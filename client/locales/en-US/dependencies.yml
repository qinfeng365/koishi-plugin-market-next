groups:
  pending:
    label: Pending
    description: These changes have not taken effect yet. Click “Apply Changes” below to install, update or uninstall.
  bundle:
    label: Plugin Bundles
    description: A bundle installs and manages a group of plugins. The bundle itself does not appear on the plugin config page.
  updatable:
    label: Updates Available
    description: npm has a newer version than the one installed.
  ignored:
    label: Ignored Updates
    description: These updates are temporarily ignored and will show up again when the rule expires or more versions are released.
  checkDisabled:
    label: Update Checks Off
    description: These dependencies will not show new versions.
  unconfigured:
    label: Not Configured
    description: Downloaded, but not yet added on the plugin config page.
  invalid:
    label: Unsupported
    description: The version range cannot be managed automatically. Edit package.json by hand.
  error:
    label: Fetch Failed
    description: Version info from npm is unavailable right now, possibly due to the network or an out-of-date mirror. Try refreshing later.
  local:
    label: Local Plugins
    description: Loaded from a workspace, a local directory or a local archive. They are not checked for updates on npm.
  manual:
    label: To Be Installed
    description: Added, but not installed yet.
  installed:
    label: Installed
    description: Up to date. Nothing to do here.
