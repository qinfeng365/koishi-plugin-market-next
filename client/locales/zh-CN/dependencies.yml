toolbar:
  blockPreview: 不提示预发布版本
  layout: 布局
  gridView: 卡片视图
  listView: 列表视图
  loading: 正在获取版本信息……
  searchPlaceholder: 搜索依赖
empty: 没有匹配的依赖
emptyHint: 换个关键词试试，或者把筛选改回「全部」。
apply:
  count: '{count} 项改动待应用'
  description: 确认后会写入 package.json 并开始安装。
  discard: 放弃改动
  apply: 应用更改
filters:
  all: 全部
  pending: 待应用
  bundle: 插件包
  unconfigured: 未配置
  updatable: 可更新
  ignored: 已忽略
  checkDisabled: 不检查更新
  invalid: 不支持
  error: 获取失败
  local: 本地插件
  manual: 待安装
groups:
  pending:
    label: 待应用
    description: 这些改动还没有生效，点击下方的「应用更改」后才会真正安装、更新或卸载。
  bundle:
    label: 插件包
    description: 插件包用来一次安装和管理一组插件，它本身不会出现在插件配置页。
  updatable:
    label: 可更新
    description: npm 上有比本地更新的版本。
  ignored:
    label: 已忽略更新
    description: 这些更新已被暂时忽略，到期或出现更多新版本后会重新提示。
  checkDisabled:
    label: 不检查更新
    description: 这些依赖不会再提示新版本。
  unconfigured:
    label: 未配置
    description: 已经下载到本地，但还没有在插件配置页里添加。
  invalid:
    label: 不支持
    description: 版本范围的写法无法自动管理，需要手动修改 package.json。
  error:
    label: 获取失败
    description: 暂时拿不到 npm 上的版本信息，可能是网络问题或镜像还没同步，稍后刷新试试。
  local:
    label: 本地插件
    description: 来自工作区、本地目录或本地压缩包，不会从 npm 检查更新。
  manual:
    label: 待安装
    description: 已经添加，但还没有安装到本地。
  installed:
    label: 已安装
    description: 已是最新版本，不需要处理。
