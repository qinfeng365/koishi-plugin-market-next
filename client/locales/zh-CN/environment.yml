title: 版本管理
intro: Market Next 会在启动时和每次依赖操作后记下所有直接依赖的版本。选一个记录，就能把依赖恢复到当时的样子。
emptyTitle: 暂时没有可以恢复的版本
loadFailedTitle: 读取失败
refresh: 刷新
current: 当前
currentEnvironment: 当前环境
dependencies: '{count} 个依赖'
reading: 正在读取记录……
empty: 目前只记录了当前环境。之后每次安装、更新或卸载依赖，都会多一条可以恢复的记录。
readingPreview: 正在对比差异……
isCurrent: 这就是当前环境，选一条更早的记录来对比差异。
noChanges: 和当前环境完全一样。
loadFailed: 读取记录失败，请检查后端日志。
loadFailedToast: 读取记录失败，请检查后端日志
previewFailed: 读取差异失败，这条记录可能已被清理。
changedCount: 与当前环境相比有 {count} 处不同
unsupportedCount: '{count} 个无法自动恢复'
showUnchanged: 显示其余 {count} 个没有变化的依赖
hideUnchanged: 隐藏没有变化的依赖
scopeWarning: 只会恢复 package.json 里的依赖版本，插件配置、数据库和插件产生的文件都不会变。
notInstalled: 未安装
restore: 恢复到这个版本
confirmTitle: 恢复依赖版本
confirmText: 将一次性应用 {count} 处依赖改动。
removeWarning: 有 {count} 个依赖会被移除，但对应的插件配置和数据会保留。
confirmRestore: 恢复
sourceStartup: 启动时
sourceOperation: 操作后
sourceExternal: 外部改动
change:
  upgrade: 升级
  downgrade: 降级
  added: 新增
  removed: 移除
  changed: 变更
  unchanged: 未变化
  unsupported: 不支持
reason:
  local: 本地来源依赖不能通过环境版本自动恢复。
  workspace: 工作区依赖由本地源码决定，不能通过环境版本自动恢复。
